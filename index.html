<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotebook</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#000; --muted:#6b6b6b; --line:#e6e6e6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#fff; --muted:#9a9a9a; --line:#1f1f1f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         display:flex; align-items:center; justify-content:center;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:32rem; padding:3rem 1.5rem; }
  h1 { font-size:3rem; letter-spacing:-.05em; margin:0; }
  p { color:var(--muted); font-size:1.05rem; max-width:22rem; }
  nav { margin-top:3rem; display:flex; flex-wrap:wrap; gap:.75rem; }
  a { color:inherit; text-decoration:none; border:1px solid var(--line);
      border-radius:999px; padding:.5rem 1.1rem; font-size:.9rem; }
  a:hover { border-color:var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Quotebook</h1>
  <p>Write down what your people actually said, before anyone can claim otherwise.</p>
  <nav>
    <a href="./terms.html">Terms of Use</a>
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./support.html">Support</a>
  </nav>
</main>
</body>
</html>
